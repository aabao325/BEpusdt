name: docker-ghcr

# 推送到 main 即自动构建并发布镜像到 GitHub Container Registry (ghcr.io)，
# 供宝塔面板直接拉取更新。
#
# 无需配置任何 Secret：使用 Actions 自带的 GITHUB_TOKEN 登录 ghcr，
# 权限由下方 permissions.packages 授予。

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # 只改文档不触发构建，省 Actions 额度
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建架构（服务器是 x86 就保持默认，ARM 服务器改成两个都选）'
        required: true
        default: 'linux/amd64'
        type: choice
        options:
          - 'linux/amd64'
          - 'linux/amd64,linux/arm64'

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name and version
        id: prep
        run: |
          # ghcr 镜像名必须全小写，仓库名 BEpusdt 含大写需转换
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

          SHA="$(git rev-parse --short=7 HEAD)"
          echo "sha=$SHA" >> $GITHUB_OUTPUT

          # 没有 tag 时 git describe 会失败，回落到 dev
          if TAG="$(git describe --tags --abbrev=0 2>/dev/null)"; then
            echo "version=${TAG}-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${SHA}" >> $GITHUB_OUTPUT
          fi

          # 手动触发时用选择的架构，push 触发时默认 amd64
          echo "platforms=${{ github.event.inputs.platforms || 'linux/amd64' }}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 本仓库的构建文件名是全小写 dockerfile，Linux 上区分大小写，必须显式指定，
          # 否则 buildx 默认找 Dockerfile 会失败
          file: ./dockerfile
          platforms: ${{ steps.prep.outputs.platforms }}
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.prep.outputs.version }}
          tags: |
            ${{ steps.prep.outputs.image }}:latest
            ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.sha }}

      - name: Summary
        run: |
          {
            echo "### 镜像已发布 :rocket:"
            echo
            echo '```'
            echo "${{ steps.prep.outputs.image }}:latest"
            echo "${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.sha }}"
            echo '```'
            echo
            echo "版本号：\`${{ steps.prep.outputs.version }}\`"
            echo "架构：\`${{ steps.prep.outputs.platforms }}\`"
            echo
            echo "宝塔拉取："
            echo '```bash'
            echo "docker pull ${{ steps.prep.outputs.image }}:latest"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
